pluginManagement {
  includeBuild(["node", "--print",
    "require('path').dirname(require.resolve('@react-native/gradle-plugin/package.json', { paths: [require.resolve('react-native/package.json')] }))"
  ].execute(null, rootDir).text.trim())
}
plugins { id("com.facebook.react.settings") }
extensions.configure(com.facebook.react.ReactSettingsExtension){ ex -> ex.autolinkLibrariesFromCommand() }
rootProject.name = 'BlockidpluginExample'
include ':app'
includeBuild(["node", "--print",
  "require('path').dirname(require.resolve('@react-native/gradle-plugin/package.json', { paths: [require.resolve('react-native/package.json')] }))"
].execute(null, rootDir).text.trim())
