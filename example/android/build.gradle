buildscript {
    ext {
        buildToolsVersion = "37.0.0"
        minSdkVersion = 28
        compileSdkVersion = 37
        targetSdkVersion = 37
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.3.0"
        // MOB-7471: AGP 9.1.1 supports Android 17 (API 37.0); requires Gradle 9.3.1.
        agp_version = '9.1.1'
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath "com.android.tools.build:gradle:$agp_version"
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion")
    }
}

// MOB-7471: Expose SDK versions at the project ext so autolinked RN native modules
// (e.g. react-native-gesture-handler via safeExtGet) resolve compileSdk/targetSdk.
// AGP 8.8 rejects a missing compileSdk. The buildscript{ext{}} block above is a separate
// scope, so the same values are declared here at project level for subprojects to read.
ext {
  buildToolsVersion = "37.0.0"
  minSdkVersion = 28
  compileSdkVersion = 37
  targetSdkVersion = 37
  ndkVersion = "27.1.12297006"
  kotlinVersion = "2.3.0"
}

allprojects {
  repositories {
    google()
    mavenCentral()
    gradlePluginPortal()
    maven {
      url 'https://artifactory.1kosmos.net/artifactory/maven-releases-local/'
      credentials {
        username = 'developer'
        password = 'xK9#mPw2$vLq7nBz!'
      }
    }
    maven { url "https://jitpack.io" }
  }
}

tasks.withType(JavaCompile).configureEach {
  options.release = 17
}

apply plugin: "com.facebook.react.rootproject"
